<style>
  :root{--bg:#0d1117;--panel:#151b24;--line:#263142;--txt:#e7ecf2;--mut:#93a1b3;--acc:#5ab0ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid var(--line);color:var(--mut);padding:5px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:600}
  main{flex:1;display:flex;min-height:0}
  #stage{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#1b2430 0%,#0d1117 75%)}
  #stage canvas{display:block;width:100%;height:100%}
  .layer{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;background:rgba(10,14,20,.76);color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
  .lbl.clk{pointer-events:auto;cursor:pointer}
  .lbl.clk:hover{background:#2b3c55}
  .lbl.zone{background:none;font-size:15px;font-weight:800;text-shadow:0 0 3px #000,0 0 6px #000}
  .lbl.ruler{background:none;color:#dfe6ee;text-shadow:0 0 3px #000,0 0 5px #000}
  .lbl.node{background:#1f7a4c;font-weight:700;padding:0 4px;border:1px solid #6fe0a5}
  .lbl.vsl{background:rgba(120,20,20,.85)} .lbl.nrv{background:rgba(120,100,10,.88)}
  .lbl.sel{outline:2px solid #fff}
  .tools{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;align-items:center}
  .tools button,.tools label{background:rgba(22,29,39,.92);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .tools button.on{border-color:var(--acc);color:var(--acc)}
  .tools label{display:flex;align-items:center;gap:6px;cursor:default}
  .tools input[type=range]{width:80px}
  .tools select{background:#10161f;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}
  .tool{background:#10161f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
  .tool label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin:4px 0}
  .tool input[type=range]{flex:1}
  .btn{border:1px solid var(--acc);background:#10233a;color:var(--acc);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;margin:2px 4px 2px 0}
  .btn.on{background:var(--acc);color:#06121f}
  .ok{color:#6fe0a5}.bad{color:#ff8a80}
  .gcard{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;background:#0e141c}.gcard summary{cursor:pointer;font-size:13px}
  .recs{padding-left:18px;margin:6px 0}.recs li{margin:4px 0;font-size:12.5px}
  .gr{display:inline-block;font-size:10.5px;border-radius:4px;padding:0 5px;margin-left:4px;border:1px solid #3a4756;color:#9fb0c3;white-space:nowrap}
  .gr-F{border-color:#2f7d55;color:#6fe0a5}.gr-D{border-color:#7d6a2f;color:#f2c14e}.gr-BP{border-color:#2f5f7d;color:#7cc4f5}
  .okb{font-size:11px;color:#6fe0a5}
  #info textarea,#info input:not([type]){background:#0b1118;color:#e6edf3;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:12.5px}.calc select,.calc input[type=number]{background:#0b1118;color:inherit;border:1px solid var(--line);border-radius:4px}
  .steps{font-size:12px;color:var(--mut)}
  .qopt{display:block;width:100%;text-align:left;margin:5px 0}
  .hint{position:absolute;bottom:6px;left:10px;font-size:11px;color:var(--mut);z-index:2;pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mut);z-index:5;background:#0d1117}
  #loading .bar{width:200px;height:4px;background:#222c3a;border-radius:3px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:var(--acc)}
  aside{width:390px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:auto}
  #presets{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px}
  .pre{border:1px solid var(--line);background:#10161f;color:var(--txt);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .pre:hover,.pre.on{border-color:var(--acc)}
  details#gwrap{border-bottom:1px solid var(--line);padding:4px 12px 10px}
  details#gwrap summary{cursor:pointer;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:6px 0}

  .grow{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none}
  .grow i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
  .grow input{margin:0}
  #info{padding:12px 14px 20px}
  #info h2{margin:0 0 2px;font-size:17px}
  #info h3{margin:14px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
  #info p{margin:5px 0}
  #info ul{margin:4px 0;padding-left:18px}
  #info li{margin:3px 0}
  #info .sub{color:var(--mut);margin-bottom:6px}
  #info .tag{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  #info .src{font-size:11px;color:var(--mut);margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
  #info table{border-collapse:collapse;width:100%;font-size:12.5px}
  #info td,#info th{border-bottom:1px solid var(--line);padding:4px;vertical-align:top;text-align:left}
  #info a{color:var(--acc);text-decoration:none;cursor:pointer}
  #info .idx{font-size:12.5px;line-height:1.9}
  #info .idx b{color:var(--mut);font-weight:600}
  #info .idx a{margin-right:9px;white-space:nowrap}
  #info .warn{background:#2a2112;border:1px solid #5b4720;border-radius:6px;padding:6px 8px;font-size:12.5px;margin-top:8px}
  #info .tip{background:#11263a;border:1px solid #23496e;border-radius:6px;padding:6px 8px;font-size:12.5px;margin-top:8px}
  .plg{display:grid;grid-template-columns:22px 1fr;gap:3px 6px;font-size:12.5px;margin-top:6px}
  .plg span{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#111}
  @media (max-width:820px){
    main{flex-direction:column}
    #stage{flex:none;height:56vh}
    aside{width:auto;border-left:none;border-top:1px solid var(--line);flex:1}
    .tabs{margin-left:0}
    header h1{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

import { guidesHTML, wireGuides } from './guides.js';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);
const ENV=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(36,1,0.05,800);
const headlight=new THREE.PointLight(0xfff4e8,60,0,1.6); camera.add(headlight);
let controls=null;
function makeControls(up){ const ar=controls?controls.autoRotate:false; if(controls) controls.dispose(); camera.up.copy(up);
  controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.08; controls.autoRotateSpeed=1.2; controls.screenSpacePanning=true; controls.autoRotate=ar; }
makeControls(new THREE.Vector3(0,1,0));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const GRAY=new THREE.Color(0x56606c);

/* ---------- loading ---------- */
const pbar=document.getElementById('pbar');
async function fetchBin(url){
  const r=await fetch(url); const total=+r.headers.get('content-length')||5.5e6; const rd=r.body.getReader(); const chunks=[]; let got=0;
  for(;;){const {done,value}=await rd.read(); if(done) break; chunks.push(value); got+=value.length; pbar.style.width=Math.min(100,got/total*100)+'%';}
  const out=new Uint8Array(got); let o=0; for(const c of chunks){out.set(c,o); o+=c.length;} return out.buffer;
}
const [MAN,BUF,EX]=await Promise.all([fetch('manifest.json').then(r=>r.json()),fetchBin('anatdata.json').then(async b=>{ const t=JSON.parse(new TextDecoder().decode(b)).gz; const bin=atob(t); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')); return await new Response(ds).arrayBuffer(); }),fetch('extras.json').then(r=>r.json())]);
const GEO={}, TAG={};
for(const e of MAN){
  const q=new Uint16Array(BUF,e.vo,e.n*3), p=new Float32Array(e.n*3);
  for(let i=0;i<e.n;i++) for(let k=0;k<3;k++) p[i*3+k]=e.min[k]+q[i*3+k]/65535*(e.max[k]-e.min[k]);
  const idx=e.i32?new Uint32Array(BUF,e.io,e.m*3):new Uint16Array(BUF,e.io,e.m*3);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setIndex(new THREE.BufferAttribute(idx.slice(),1)); g.computeVertexNormals(); g.computeBoundsTree();
  if(e.morph){ g.morphAttributes.position=e.morph.map(mm=>{ const q2=new Uint16Array(BUF,mm.o,e.n*3), a=new Float32Array(e.n*3); for(let i=0;i<e.n*3;i++){ const k=i%3; a[i]=e.min[k]+q2[i]/65535*(e.max[k]-e.min[k]); } const ba=new THREE.BufferAttribute(a,3); ba.name=mm.name; return ba; }); }
  GEO[e.id]=g; if(e.to!==undefined) TAG[e.id]=new Uint8Array(BUF,e.to,e.n);
}
document.getElementById('loading').remove();
if(EX.lap) EX.lap.supra_in=[1.5,3.5,5.2];

/* ---------- materials ---------- */
const noise=(x,y,z)=>{const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453; return s-Math.floor(s);};
const fbm=(x,y,z)=>.55*noise(Math.floor(x*2),Math.floor(y*2),Math.floor(z*2))+.45*noise(Math.floor(x*5),Math.floor(y*5),Math.floor(z*5));
function colorize(g, fn, varAmt=.12){
  const p=g.attributes.position, n=p.count, a=new Float32Array(n*3), c=new THREE.Color();
  for(let i=0;i<n;i++){ fn(i,c); const m=1-varAmt/2+varAmt*fbm(p.getX(i),p.getY(i),p.getZ(i)); a[i*3]=c.r*m; a[i*3+1]=c.g*m; a[i*3+2]=c.b*m; }
  g.setAttribute('color',new THREE.BufferAttribute(a,3)); return a;
}
const NOISE_GLSL=`
float h3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i+vec3(0,0,0)),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
vec3 pertN(vec3 sp, vec3 sn, vec2 dH, float fd){ vec3 sx=dFdx(sp), sy=dFdy(sp); vec3 r1=cross(sy,sn), r2=cross(sn,sx); float det=dot(sx,r1)*fd; vec3 g=sign(det)*(dH.x*r1+dH.y*r2); return normalize(abs(det)*sn-g); }`;
function realize(mat,o={}){
  const fiber=o.fiber||null, amp=(o.amp??(fiber?.03:.012))*.3, freq=(o.freq??(fiber?5.5:2.2))*.45, cut=o.cut||null;
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uFib={value:fiber?new THREE.Vector3(...fiber).normalize():new THREE.Vector3(0,0,0)}; sh.uniforms.uAmp={value:amp}; sh.uniforms.uFreq={value:freq}; sh.uniforms.uCut={value:cut?new THREE.Vector4(cut[0],cut[1],cut[2],cut[3]):new THREE.Vector4(0,0,0,0)}; sh.uniforms.uCutA={value:cut?cut[4]:0}; mat.userData.sh=sh;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vObjP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvObjP=position;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vObjP; uniform vec3 uFib; uniform float uAmp; uniform float uFreq; uniform vec4 uCut; uniform float uCutA;'+NOISE_GLSL)
      .replace('#include <clipping_planes_fragment>','#include <clipping_planes_fragment>\n if(uCut.z>0.0){ vec2 dd=vObjP.xy-uCut.xy; float ca=cos(uCutA), sa=sin(uCutA); vec2 rr=vec2(ca*dd.x+sa*dd.y,-sa*dd.x+ca*dd.y); if(rr.x*rr.x/(uCut.z*uCut.z)+rr.y*rr.y/(uCut.w*uCut.w)<1.0 && vObjP.z>1.0) discard; }')
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      { vec3 p=vObjP; float h;
        if(dot(uFib,uFib)>0.0){ vec3 q=p-uFib*dot(p,uFib)*.85; h=.8*vn(q*uFreq*1.6+vec3(0,0,vn(p*.5)*1.5))+.2*vn(p*uFreq); }
        else { h=.6*vn(p*uFreq)+.4*vn(p*uFreq*3.1); }
        h*=uAmp*20.0; normal=pertN(-vViewPosition, normal, vec2(dFdx(h),dFdy(h)), faceDirection); }`);
  };
  mat.customProgramCacheKey=()=>'rl'+(fiber?fiber.join(','):'o')+amp+freq+(cut?'c':'');
  return mat;
}
function physMat(o={},r={}){ return realize(new THREE.MeshPhysicalMaterial(Object.assign({vertexColors:true,roughness:.5,metalness:0,clearcoat:.35,clearcoatRoughness:.35,envMap:ENV,envMapIntensity:.55},o)),r); }
const COL={muscle:0xa63d33,apo:0xe9e1d2,tend:0xf0e8d8,bone:0xe6d8bb,cart:0xb9d0d6,diaph:0xa0443a,stomach:0xd99484,eso:0xc9837a,liver:0x7b2c22,spleen:0x6a2438,pancreas:0xe2b77f,duod:0xd4978a,gb:0x3f6b2f,kidney:0x8b3a2e,adrenal:0xd9a441,art:0xc4211b,vein:0x2e4fae,bladder:0xe3bba2,colon:0xc79a7a,lig:0xf0e9dc,psoas:0x9e3b33};
function meshOf(id, base, o={}){
  const g=o.clone?GEO[id].clone():GEO[id];
  if(o.clone) g.boundsTree=GEO[id].boundsTree;
  if(!g.attributes.color || o.clone) colorize(g, o.fn || ((i,c)=>c.setHex(base)), o.vary??.12);
  const m=new THREE.Mesh(g, o.mat || physMat(o.m||{},o.r||{})); m.userData.mesh=id; if(g.morphAttributes.position) m.updateMorphTargets(); return m;
}
function tubeMesh(L){
  const pts=L.p.map(p=>V(...p)); if(pts.length<2) return null;
  const c=new THREE.CatmullRomCurve3(pts,false,'centripetal');
  return new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(20,pts.length*8),L.r,10,false), new THREE.MeshPhysicalMaterial({color:L.c,roughness:.4,clearcoat:.6,clearcoatRoughness:.25,envMap:ENV,envMapIntensity:.6}));
}
function polyline(pts,color,o={}){
  const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>Array.isArray(p)?V(...p):p));
  const m=o.dash? new THREE.LineDashedMaterial({color,dashSize:o.dash,gapSize:o.dash*.7,transparent:true,opacity:o.op??1,depthTest:o.dt??true}) : new THREE.LineBasicMaterial({color,transparent:true,opacity:o.op??1,depthTest:o.dt??true});
  const l=new THREE.Line(g,m); if(o.dash) l.computeLineDistances(); return l;
}
function polyMesh(P,color,op=.5){
  const pts=P.map(p=>V(...p)); const c=pts.reduce((a,b)=>a.add(b),V(0,0,0)).multiplyScalar(1/pts.length);
  const pos=[]; for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length]; pos.push(c.x,c.y,c.z,a.x,a.y,a.z,b.x,b.y,b.z);}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-4}));
}

/* ---------- engine ---------- */
let cur=null, sel=null, showLbl=true;
const views={}; let nvVis=false;
class View{
  constructor(id){ this.id=id; this.scene=new THREE.Scene(); this.scene.add(camera.parent===null?camera:new THREE.Object3D());
    this.scene.add(new THREE.HemisphereLight(0xfff6ee,0x2a2f38,.55));
    const d=new THREE.DirectionalLight(0xffffff,1.1); d.position.set(10,25,35); this.scene.add(d);
    const d2=new THREE.DirectionalLight(0xbcd0ff,.35); d2.position.set(-20,-5,-25); this.scene.add(d2);
    this.layer=document.createElement('div'); this.layer.className='layer'; stage.appendChild(this.layer);
    this.groups=[]; this.gmap={}; this.items={}; this.labels=[]; this.pick=[]; this.repaint=[]; this.presets=[]; this.explode=false; views[id]=this; }
  group(id,name,color,on=true,ez=0){ const g={id,name,color,on,ez,obj:new THREE.Group()}; this.scene.add(g.obj); this.groups.push(g); this.gmap[id]=g; return g; }
  item(id,def){ this.items[id]=Object.assign({id,objs:this.pick.filter(o=>o.userData.item===id)},def); return this.items[id]; }
  add(gid,obj,iid){ if(!obj) return null; this.gmap[gid].obj.add(obj); obj.userData.gid=gid;
    if(iid){ obj.userData.item=iid; if(this.items[iid]) this.items[iid].objs.push(obj); }
    if(iid||obj.userData.classify) this.pick.push(obj); return obj; }
  label(gid,p,text,o={}){ const el=document.createElement('div'); el.className='lbl '+(o.cls||''); el.textContent=text;
    if(o.item){ el.classList.add('clk'); el.addEventListener('click',e=>{e.stopPropagation(); select(o.item===sel?null:o.item);}); }
    this.layer.appendChild(el); this.labels.push({p:Array.isArray(p)?V(...p):p.clone(),el,gid,item:o.item||null,keep:/zone|node|ruler/.test(o.cls||''),occ:false}); }
  setPreset(list){ for(const g of this.groups){ g.on=list.includes(g.id); g.obj.visible=g.on; } if(this.gmap.fem){ this.gmap.fem.on=female; this.gmap.fem.obj.visible=female; } }
}
function info(sub,lim,bul,extra=''){ return `<p class="sub">${sub}</p>${lim?`<h3>Descripción</h3><p>${lim}</p>`:''}${bul&&bul.length?`<h3>Relevancia quirúrgica</h3><ul>${bul.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}${extra}`; }

const LINES={}; for(const L of EX.lines){ (LINES[L.g]=LINES[L.g]||[]).push(L); }

function addExLabels(v,gid){ for(const L of (LBYG[gid]||[])) v.label(gid,L.p,L.t,{item:L.item,cls:L.cls||''}); }
function centroid(id,filter){ const p=GEO[id].attributes.position; const c=V(0,0,0); let n=0; for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i); if(filter&&!filter(x,y,z)) continue; c.x+=x;c.y+=y;c.z+=z;n++; } return n?c.multiplyScalar(1/n):c; }
function extreme(id,fn){ const p=GEO[id].attributes.position; let best=null,bv=-1e9; for(let i=0;i<p.count;i++){ const v=fn(p.getX(i),p.getY(i),p.getZ(i)); if(v>bv){bv=v; best=V(p.getX(i),p.getY(i),p.getZ(i));} } return best; }

  v.intro=`<h2>Región inguinal derecha · visión TAPP/TEP</h2>
  <p class="sub">Cámara dentro del abdomen, como el laparoscopio desde el ombligo: arriba la pared anterior; en el lado derecho, lo medial (vejiga, línea media) queda a la izquierda de la pantalla y lo lateral (EIAS) a la derecha. Pelvis, vasos ilíacos, psoas, vejiga y músculos son mallas reales; cordón, nervios y triángulos están trazados sobre ellos.</p>
  <h3>Las cinco referencias</h3>
  <table><tr><th>Fosa lateral</th><td>Anillo profundo, lateral a epigástricos → indirecta</td></tr><tr><th>Hesselbach</th><td>Medial a epigástricos → directa</td></tr><tr><th>Anillo femoral</th><td>Bajo el tracto iliopúbico, medial a la vena → femoral</td></tr><tr><th>Fatalidad</th><td>Entre deferente y espermáticos: vasos ilíacos</td></tr><tr><th>Dolor</th><td>Bajo el tracto iliopúbico, lateral a espermáticos: nervios</td></tr></table>
  <div class="warn">Sin fijación por debajo del tracto iliopúbico salvo en el ligamento de Cooper.</div>
  <h3>Orificio miopectíneo y malla</h3>
  <p>El MPO (Fruchaud) está limitado por el arco del TA/OI, el borde del recto, el psoas-ilíaco y el pecten/Cooper. La malla (≥ 10 × 15 cm) debe cubrirlo entero con solapamiento, sobrepasar la sínfisis y quedar plana sobre el cordón parietalizado. «Critical view of the MPO»: sínfisis, Cooper, epigástricos, tracto iliopúbico, deferente y vasos parietalizados.</p>
  <div class="src">Anatomía 3D: BodyParts3D, CC BY-SA 2.1 JP. Estructuras finas trazadas de forma esquemática sobre la anatomía real. Fuentes: HerniaSurge Group. <i>Hernia</i> 2018;22:1–165 · actualización HerniaSurge, <i>BJS Open</i> 2023;7:zrad080 · Daes J, Felix E. <i>Ann Surg</i> 2017;266:e1–e2.</div>`;
  return v;

  const all=[]; for(const it of objs){ const segs=sliceSegs(it.o,T.axis,T.pos); if(segs.length) all.push({loops:chain(segs,T.axis),col:it.h[1]}); }
  let mn=[1e9,1e9],mx=[-1e9,-1e9]; for(const a of all) for(const L of a.loops) for(const p of L){ mn[0]=Math.min(mn[0],p[0]); mn[1]=Math.min(mn[1],p[1]); mx[0]=Math.max(mx[0],p[0]); mx[1]=Math.max(mx[1],p[1]); }
  if(!all.length){ ctx.fillStyle='#888'; ctx.fillText('Sin estructuras en este plano',10,20); return; }
  const sc=Math.min((cv.width-20)/(mx[0]-mn[0]),(cv.height-20)/(mx[1]-mn[1])); const ox=(cv.width-(mx[0]-mn[0])*sc)/2, oy=(cv.height-(mx[1]-mn[1])*sc)/2;
  for(const a of all){ ctx.beginPath(); for(const L of a.loops){ L.forEach((p,i)=>{ const X=ox+(p[0]-mn[0])*sc, Y=oy+(p[1]-mn[1])*sc; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.closePath(); } ctx.fillStyle=a.col; ctx.fill('evenodd'); }
  ctx.fillStyle='#9fb3c8'; ctx.font='11px sans-serif'; const lab=T.axis==='y'?['D','I','ANT']:T.axis==='z'?['D','I','CRAN']:['ANT','POST','CRAN']; ctx.fillText(lab[0],4,cv.height/2); ctx.fillText(lab[1],cv.width-12,cv.height/2); ctx.fillText(lab[2],cv.width/2-10,12);
  ctx.fillText('10 cm',8,cv.height-8); ctx.fillRect(8,cv.height-20,10*sc,2); }

  if(tool==='measure'){ const mm=toolState.mmode;
    if(mm!=='area'&&toolState.pts.length>=2){ clearTool(); toolState.pts=[]; } toolState.pts.push(p);
    const m=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),new THREE.MeshBasicMaterial({color:0x00e5ff,depthTest:false})); m.position.copy(p); m.renderOrder=7; tg().add(m);
    if(mm==='line'&&toolState.pts.length===2){ const [a,b]=toolState.pts; tg().add(polyline([a,b],0x00e5ff,{dt:false})); toolState.res=a.distanceTo(b); toolLabel(a.clone().add(b).multiplyScalar(.5).add(V(0,.6,0)),toolState.res.toFixed(1)+' cm','ruler'); }
    if(mm==='surf'&&toolState.pts.length===2){ const [a,b]=toolState.pts; const rc=new THREE.Raycaster(); rc.firstHitOnly=true; const objs=solidObjs(); const path=[a]; for(let i=1;i<40;i++){ const q=a.clone().lerp(b,i/40); const dir=q.clone().sub(camera.position).normalize(); rc.set(camera.position,dir); const hh=rc.intersectObjects(objs,false)[0]; path.push(hh?hh.point:q); } path.push(b);
      let L=0; for(let i=1;i<path.length;i++) L+=path[i].distanceTo(path[i-1]); toolState.res=L; tg().add(polyline(path.map(q=>q.clone().addScaledVector(camera.position.clone().sub(q).normalize(),.08)),0x00e5ff,{dt:false})); toolLabel(path[20].clone().add(V(0,.6,0)),L.toFixed(1)+' cm (superficie)','ruler'); }
    if(mm==='area'&&toolState.pts.length>1){ const P=toolState.pts; tg().add(polyline([P[P.length-2],P[P.length-1]],0x00e5ff,{dt:false})); }
    renderInfo(); }
  else if(tool==='defect'){ const D=toolState.defects; if(!D.length||!toolState.add){ toolState.defects=[{F:frameAt(p,n),a:0,b:0,W:toolState.W,L:toolState.L,zone:ehsAt(p)}]; } else { const F=D[0].F, d=p.clone().sub(F.c); D.push({F,a:d.dot(F.u),b:d.dot(F.w),W:toolState.W,L:toolState.L,zone:ehsAt(p)}); } toolState.add=false; drawDefect(); }
  else if(tool==='trocar'){ const k=toolState.trocars.length+1; const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,3.2,20),new THREE.MeshPhysicalMaterial({color:0x9aa7b4,metalness:.8,roughness:.25,envMap:ENV})); c.position.copy(p).addScaledVector(n,1.2); c.quaternion.setFromUnitVectors(V(0,1,0),n); tg().add(c);
    const dIEA=distTo(['iea_R','iea_L','iev_R','iev_L','sea','sev'],p); toolState.trocars.push({p,n,zone:ehsAt(p),dIEA}); toolLabel(p.clone().addScaledVector(n,3.4),'T'+k,dIEA<2.5?'vsl':'node'); renderInfo(); } }
function closeArea(){ const P=toolState.pts; if(P.length<3) return; tg().add(polyline([P[P.length-1],P[0]],0x00e5ff,{dt:false})); const c=P.reduce((a,b)=>a.clone().add(b),V(0,0,0)).multiplyScalar(1/P.length); let A=0,per=0;
  for(let i=0;i<P.length;i++){ const a=P[i],b=P[(i+1)%P.length]; A+=new THREE.Vector3().crossVectors(a.clone().sub(c),b.clone().sub(c)).length()/2; per+=a.distanceTo(b); } toolState.res=A; toolState.per=per; toolLabel(c.clone().add(V(0,.5,0)),A.toFixed(1)+' cm²','ruler'); toolState.closed=true; renderInfo(); }

function paintBarrett(){ const v=views.ueg; const m=v.gmap.organ.obj.children.find(o=>o.userData.mesh==='esophagus'); if(!m) return; const egj=V(...EX.pts.egj), ax=V(...EX.pts.ax); const p=m.geometry.attributes.position, col=m.geometry.attributes.color.array;   const ref=V(0,0,1).addScaledVector(ax,-ax.z).normalize(), ref2=new THREE.Vector3().crossVectors(ax,ref); const w=V(0,0,0);
  if(!(BAR.C||BAR.M)) return;
  for(let i=0;i<p.count;i++){ w.fromBufferAttribute(p,i).sub(egj); const d=w.dot(ax); const ang=Math.atan2(w.dot(ref2),w.dot(ref)); let on=d>-.2&&(d<BAR.C||(d<BAR.M&&Math.abs(ang)<.55));
    if(on){ col[i*3]=1; col[i*3+1]=.55; col[i*3+2]=.4; } } m.geometry.attributes.color.needsUpdate=true; }
function uegPanels(){ const area=.5*HSA.a*HSA.b*Math.sin(HSA.g*Math.PI/180);
  return `<h3>Barrett (Praga C&M)</h3><div class="tool"><label>C (circunferencial) <input type="range" min="0" max="10" step=".5" value="${BAR.C}" data-barrett="C"> <b>${BAR.C} cm</b></label><label>M (máxima) <input type="range" min="0" max="12" step=".5" value="${BAR.M}" data-barrett="M"> <b>${BAR.M} cm</b></label><p class="steps">Pinta la extensión sobre el esófago real (proyección externa). <a data-item="barrett">Ver ficha y Hill</a></p></div>
  <h3>Superficie del hiato (HSA)</h3><div class="tool"><label>Pilar derecho <input type="range" min="1" max="8" step=".1" value="${HSA.a}" data-hsa="a"> <b>${HSA.a} cm</b></label><label>Pilar izquierdo <input type="range" min="1" max="8" step=".1" value="${HSA.b}" data-hsa="b"> <b>${HSA.b} cm</b></label><label>Ángulo <input type="range" min="10" max="90" step="1" value="${HSA.g}" data-hsa="g"> <b>${HSA.g}°</b></label>
  <p>HSA ≈ ½·a·b·sen(α) = <b>${area.toFixed(1)} cm²</b></p><p class="steps">Fórmula triangular (Granderath). No hay un umbral universal; en algunas series se considera «hiato grande» a partir de ~5 cm² y se valora el refuerzo.</p></div>`; }

function buildTechOverlays(){
  const yel=0xffd400, cy=0x00e5ff;
  const tube=(p,c,r=.12)=>tubeMesh({p,r,c});
  const add=(v,k,o)=>{ if(!o) return; v.techObj=v.techObj||new THREE.Group(); if(!v.techObj.parent) v.scene.add(v.techObj); o.visible=false; o.traverse(c=>{ c.renderOrder=6; if(c.material&&k.match(/rs_open|tar_|sac_|flap|crura|sleeve|pouch/)){ c.material.depthTest=false; c.material.transparent=true; } }); v.techObj.add(o); (v.techMap=v.techMap||{})[k]=o; };
  const sheetMat=()=>new THREE.MeshPhysicalMaterial({color:0xf4f7fb,transparent:true,opacity:.55,side:THREE.DoubleSide,roughness:.4,depthWrite:false,wireframe:false});
  const P=views.pared, I=views.ingle, U=views.ueg;
  for(const s of ['R','L']){ add(P,'rs_open_'+s,tube(EX.inc['rs_open_'+s],yel)); add(P,'tar_'+s,tube(EX.inc['tar_'+s],cy)); add(P,'sac_'+s,tube(EX.inc['sac_'+s],yel)); }
  add(P,'mesh_rs',new THREE.Mesh(GEO.mesh_rs,sheetMat())); add(P,'mesh_tar',new THREE.Mesh(GEO.mesh_tar,sheetMat()));
  { const g=new THREE.Group(); const rc=new THREE.Raycaster(); for(const [x,y] of [[-10,6],[-11,-2],[-9.5,-10]]){ rc.set(V(x,y,40),V(0,0,-1)); const h=rc.intersectObjects(P.gmap.eo.obj.children.filter(o=>o.isMesh),false)[0]; if(!h) continue; const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,3.2,20),new THREE.MeshPhysicalMaterial({color:0x9aa7b4,metalness:.8,roughness:.25,envMap:ENV})); c.position.copy(h.point).add(V(-.3,0,1.2)); c.quaternion.setFromUnitVectors(V(0,1,0),V(-.3,0,1).normalize()); g.add(c);} add(P,'etep',g); }
  add(I,'tapp_flap',tube(EX.inc.tapp_flap,yel,.1)); add(I,'mesh_licht',new THREE.Mesh(GEO.mesh_licht,sheetMat())); add(U,'sleeve',tube(EX.inc.sleeve,yel,.1)); add(U,'pouch',tube(EX.inc.pouch,yel,.1)); add(I,'mesh_tapp',new THREE.Mesh(GEO.mesh_tapp,sheetMat()));
  { const egj=V(...EX.pts.egj), ax=V(...EX.pts.ax); const w=new THREE.Mesh(new THREE.TorusGeometry(1.75,.6,16,40),physMat({vertexColors:false,color:0xf0a898,emissive:0x331410},{amp:.015,freq:2})); w.position.copy(egj).addScaledVector(ax,1.6); w.quaternion.setFromUnitVectors(V(0,0,1),ax); add(U,'wrap',w);
    const h=V(...EX.pts.hiat); const g=new THREE.Group(); for(let k=0;k<3;k++){ const y=-.5+k*.55; g.add(tube([[h.x-1.5,h.y+y,h.z-1.8],[h.x,h.y+y-.1,h.z-2.2],[h.x+1.5,h.y+y,h.z-1.8]],0xffffff,.07)); } add(U,'crura',g); }
}
function applyStep(){ const T=techState; if(!T) return; const st=T.tech.steps[T.k];
  cur.setPreset(st.g); T.lapOn=false; if(st.cam) camTo(st.cam); else { if(cur.up) makeControls(cur.up); else makeControls(V(0,1,0)); cur.home(); }
  for(const k in (cur.techMap||{})) cur.techMap[k].visible=(st.ov||[]).includes(k);
  if(st.per!==undefined) setPer(st.per); if(st.liver!==undefined) setLiver(st.liver); if(st.hh!==undefined) setHH(st.hh);
  sel=st.hl||null; renderGroups(); highlight(); renderInfo(); }
function startTech(id){ const t=(TECH[cur.id]||[]).find(x=>x.id===id); if(!t) return; techState={tech:t,k:0}; quiz=null; applyStep(); }
function endTech(){ techState=null; for(const k in (cur.techMap||{})) cur.techMap[k].visible=false; sel=null; renderInfo(); highlight(); }
function techPanel(){ const T=techState, st=T.tech.steps[T.k];
  return `<p class="steps">${T.tech.name} · paso ${T.k+1}/${T.tech.steps.length}</p><h2>${st.t}</h2><p>${st.d}</p>${st.hl&&cur.items[st.hl]?`<p><a data-item-info="${st.hl}">Ver ficha: ${cur.items[st.hl].name}</a></p>`:''}
  ${st.lap?`<p><button class="btn ${T.lapOn?'on':''}" data-lap>Vista por la óptica (desde el puerto)</button></p>`:''}
  <p><button class="btn" data-tprev ${T.k===0?'disabled':''}>← Anterior</button><button class="btn" data-tnext>${T.k===T.tech.steps.length-1?'Finalizar':'Siguiente →'}</button><button class="btn" data-tend>Salir</button></p>`; }

let quiz=null;
function quizPool(){ return Object.values(cur.items).filter(it=>it.objs.length>0&&!/^pf/.test(it.id)); }
function newQuestion(){ const pool=quizPool(); if(pool.length<4){ quiz=null; return; } const it=pool[Math.floor(Math.random()*pool.length)];
  const type=Math.random()<.5?'tap':'mc'; quiz.q={type,id:it.id,res:null};
  if(type==='mc'){ const opts=new Set([it.id]); while(opts.size<4) opts.add(pool[Math.floor(Math.random()*pool.length)].id); quiz.q.opts=[...opts].sort(()=>Math.random()-.5); }
  ensureOn(it.objs[0].userData.gid); sel=type==='mc'?it.id:null; highlight(); }
function startQuiz(){ techState=null; quiz={score:0,n:0}; newQuestion(); renderInfo(); }
function quizAnswer(id){ const q=quiz.q; if(q.res) return; q.res=(id===q.id)?'ok':'bad'; quiz.n++; if(q.res==='ok') quiz.score++; sel=q.id; highlight(); renderInfo(); }
function quizPanel(){ const q=quiz.q, it=cur.items[q.id]; const nm=x=>cur.items[x].name;
  let h=`<p class="steps">Modo examen · ${quiz.score}/${quiz.n}</p>`;
  if(q.type==='tap') h+=`<h2>Toca en el modelo: ${it.name}</h2><p class="steps">(o su etiqueta; desactiva «Etiquetas» para hacerlo más difícil)</p>`;
  else h+=`<h2>¿Qué estructura está resaltada?</h2>${q.opts.map(o=>`<button class="btn qopt" data-qa="${o}">${nm(o)}</button>`).join('')}`;
  if(q.res) h+=`<p class="${q.res}">${q.res==='ok'?'✓ Correcto':'✗ Era: '+it.name}</p><div>${it.html}</div><button class="btn" data-qnext>Siguiente pregunta</button>`;
  return h+`<p><button class="btn" data-qend>Salir del examen</button></p>`; }

function fit(target,dir,w,h){
  const W=stage.clientWidth||1,H=stage.clientHeight||1,asp=W/H,t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(h/(2*t),w/(2*t*asp))*1.05; controls.target.copy(target); camera.position.copy(target).addScaledVector(dir.clone().normalize(),d); controls.update();
}

function highlight(){
  for(const v of Object.values(views)) for(const it of Object.values(v.items)) for(const o of it.objs){ const m=o.material; if(m&&m.emissive){ if(o.userData.e0===undefined) o.userData.e0=m.emissive.getHex(); m.emissive.setHex(it.id===sel&&v===cur?0x553322:o.userData.e0); } }

}
function indexHTML(){
  let h='<h3>Índice de estructuras</h3><div class="idx">'; const byG={};
  for(const it of Object.values(cur.items)){ if(it.id==='nodes_tbl'||it.grp==='cortes') continue; const g=(it.objs[0]&&it.objs[0].userData.gid)||'organ'; (byG[g]=byG[g]||[]).push(it); }
  for(const g of cur.groups){ const arr=byG[g.id]; if(!arr) continue; h+=`<div><b>${g.name}:</b> ${arr.map(it=>`<a data-item="${it.id}">${it.name.replace(/^Grupo /,'').split(' · ')[0]}</a>`).join('')}</div>`; }
  return h+'</div>';
}
let guideOn=false; const gctx={gtab:'g'};
function renderInfo(){
  const tbtn=`<div style="margin:0 0 8px">${cur.id==='pared'?'<button class="btn" data-settool="defect">Simular defecto y malla</button><button class="btn" data-settool="trocar">Planificar trócares</button>':''}<button class="btn" data-settool="measure">Medir</button>${cur.id!=='pac'?'<button class="btn" data-settool="ct">Corte TC</button>':''}${cur.id!=='pac'?'<button class="btn" data-quiz>Modo examen</button>':''}<button class="btn" data-guides>Guías · calculadoras · informe</button></div>`;
  const tp=tool?toolPanel():'';
  if(guideOn&&!techState&&!(quiz&&quiz.q)){ gctx.BAR=BAR; gctx.auto=reportAuto; gctx.close=()=>{guideOn=false; renderInfo();}; infoEl.innerHTML=tp+guidesHTML(cur.id,gctx); wireGuides(infoEl,cur.id,gctx,renderInfo); }
  else if(techState) infoEl.innerHTML=tp+techPanel();
  else if(quiz&&quiz.q) infoEl.innerHTML=tp+quizPanel();
  else if(!sel||!cur.items[sel]) infoEl.innerHTML=tp+tbtn+cur.intro+(cur.id==='ueg'?uegPanels():'')+techListHTML()+indexHTML();
  else { const it=cur.items[sel]; infoEl.innerHTML=`<h2><span class="tag" style="background:${it.color}"></span>${it.name}</h2>${it.html}<p style="margin-top:14px"><a data-back="1">← Volver al resumen</a></p>`; }
  infoEl.querySelectorAll('a[data-item]').forEach(a=>a.onclick=e=>{e.preventDefault(); select(a.dataset.item);});
  infoEl.querySelectorAll('a[data-back]').forEach(a=>a.onclick=e=>{e.preventDefault(); select(null);});
  infoEl.querySelectorAll('a[data-item-info]').forEach(a=>a.onclick=e=>{e.preventDefault(); const k=a.dataset.itemInfo; techState=null; select(k);});
  infoEl.querySelectorAll('[data-settool]').forEach(b=>b.onclick=()=>setTool(b.dataset.settool));
  infoEl.querySelectorAll('[data-tool-off]').forEach(b=>b.onclick=()=>setTool(tool));
  infoEl.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{ clearTool(); toolState.trocars=[]; toolState.defects=[]; toolState.sum=null; toolState.pts=[]; toolState.res=undefined; toolState.closed=false; renderInfo(); });
  infoEl.querySelectorAll('input[data-p]').forEach(r=>r.onchange=r.oninput=()=>{ toolState[r.dataset.p]=+r.value; const D=toolState.defects; if(D.length&&r.dataset.p!=='ov'){ const d=D[D.length-1]; d.W=toolState.W; d.L=toolState.L; } if(D.length) drawDefect(); else renderInfo(); });
  infoEl.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ toolState.mmode=b.dataset.mm; clearTool(); toolState.pts=[]; toolState.res=undefined; toolState.closed=false; renderInfo(); });
  infoEl.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeArea);
  infoEl.querySelectorAll('[data-adddef]').forEach(b=>b.onclick=()=>{ toolState.add=true; });
  infoEl.querySelectorAll('[data-ax]').forEach(b=>b.onclick=()=>{ toolState.ct.axis=b.dataset.ax; const r=ctRange(); toolState.ct.pos=(r[0]+r[1])/2; renderInfo(); updateCT(); });
  infoEl.querySelectorAll('[data-ctpos]').forEach(r=>r.oninput=()=>{ toolState.ct.pos=+r.value; r.nextElementSibling.textContent=(+r.value).toFixed(1); updateCT(); });
  if(tool==='ct') setTimeout(drawCT,0);
  infoEl.querySelectorAll('[data-barrett]').forEach(r=>r.oninput=()=>{ BAR[r.dataset.barrett]=+r.value; r.nextElementSibling.textContent=r.value+' cm'; highlight(); });
  infoEl.querySelectorAll('[data-hsa]').forEach(r=>r.oninput=()=>{ HSA[r.dataset.hsa]=+r.value; renderInfo(); });
  infoEl.querySelectorAll('[data-tech]').forEach(b=>b.onclick=()=>startTech(b.dataset.tech));
  infoEl.querySelectorAll('[data-tprev]').forEach(b=>b.onclick=()=>{ techState.k--; applyStep(); });
  infoEl.querySelectorAll('[data-tnext]').forEach(b=>b.onclick=()=>{ if(techState.k<techState.tech.steps.length-1){ techState.k++; applyStep(); } else endTech(); });
  infoEl.querySelectorAll('[data-tend]').forEach(b=>b.onclick=endTech);
  infoEl.querySelectorAll('[data-lap]').forEach(b=>b.onclick=()=>{ const st=techState.tech.steps[techState.k]; techState.lapOn=!techState.lapOn; if(techState.lapOn){ const P=k=>EX.lap[k]||EX.pts[k]; makeControls(V(0,1,0)); for(const gid of ['liver','big','retro','medias']) if(cur.gmap[gid]){ cur.gmap[gid].on=false; cur.gmap[gid].obj.visible=false; } renderGroups(); camTo({p:P(st.lap.p),t:P(st.lap.t),fov:62}); } else applyStep(); renderInfo(); });
  infoEl.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=startQuiz);
  infoEl.querySelectorAll('[data-guides]').forEach(b=>b.onclick=()=>{ guideOn=true; sel=null; highlight(); renderInfo(); });
  infoEl.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>quizAnswer(b.dataset.qa));
  infoEl.querySelectorAll('[data-qnext]').forEach(b=>b.onclick=()=>{ newQuestion(); renderInfo(); });
  infoEl.querySelectorAll('[data-qend]').forEach(b=>b.onclick=()=>{ quiz=null; sel=null; highlight(); renderInfo(); });
  if(cur.id==='pac') wirePac();
}
function ensureOn(gid){ const g=cur.gmap[gid]; if(g&&!g.on){ g.on=true; g.obj.visible=true; renderGroups(); } }
function select(id){
  if(quiz&&quiz.q&&quiz.q.type==='tap'&&!quiz.q.res){ if(id) quizAnswer(id); return; }
  if(quiz&&quiz.q&&quiz.q.type==='mc') return;
  sel=id; if(id) guideOn=false;
  if(id&&cur.items[id]){ const it=cur.items[id]; if(it.objs[0]) ensureOn(it.objs[0].userData.gid);
    if(['I','II','III'].includes(id)) ensureOn('sie'); if(EHSI[id]) ensureOn('ehs'); if(['cardia','fundus','cuerpo','antro','pyl','eso_t','eso_a'].includes(id)) ensureOn('organ'); }
  highlight(); renderInfo();
  if(id&&window.innerWidth<=820) infoEl.scrollIntoView({behavior:'smooth',block:'start'});
}
function show(id){
  guideOn=false; { const st=document.getElementById('nvStage'); if(st) st.style.display=(id==='pac'&&nvVis)?'block':'none'; }
  if(cur){ tool=null; clearTool(); techState=null; quiz=null; for(const k in (cur.techMap||{})) cur.techMap[k].visible=false; }
  if(!views[id]) id='pared'; cur=views[id]; sel=null;
  cur.scene.add(camera); makeControls(cur.up||new THREE.Vector3(0,1,0));
  for(const v of Object.values(views)) v.layer.style.display=v===cur?'':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===id));
  for(const g of cur.groups) g.obj.visible=g.on;
  document.getElementById('explodeW').style.display=cur.explode?'':'none';
  const TL=cur.tools||[]; document.getElementById('opW').style.display=TL.includes('liver')?'':'none'; document.getElementById('perW').style.display=TL.includes('perit')?'':'none';
  document.getElementById('skinW').style.display=TL.includes('skin')?'':'none'; document.getElementById('hhW').style.display=TL.includes('hh')?'':'none'; document.getElementById('bDia').style.display=TL.includes('dia')?'':'none';
  document.getElementById('bMeasure').classList.remove('on'); for(const [id,k] of [['bObese','obese'],['bFem','fem'],['bCT','ct']]) document.getElementById(id).style.display=TL.includes(k)?'':'none'; renderer.clippingPlanes=[]; if(camera.fov!==36){ camera.fov=36; camera.updateProjectionMatrix(); } document.getElementById('gwrap').style.display=cur.id==='pac'?'none':'';
  applyExplode(); cur.home(); renderGroups(); highlight(); renderInfo();
}
function applyExplode(){ if(!cur.explode) return; const e=+document.getElementById('explode').value; for(const g of cur.groups) g.obj.position.z=g.ez*e; }
document.getElementById('explode').oninput=applyExplode;
document.getElementById('liverOp').oninput=e=>{ for(const m of (cur.liverMats||[])){ m.opacity=+e.target.value; m.depthWrite=m.opacity>.95; m.needsUpdate=true; } };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ try{location.hash=t.dataset.v;}catch(e){} show(t.dataset.v); });
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(views[h]&&views[h]!==cur) show(h);});
document.getElementById('bReset').onclick=()=>cur.home();
document.getElementById('bSpin').onclick=e=>{controls.autoRotate=!controls.autoRotate; e.currentTarget.classList.toggle('on',controls.autoRotate);};
document.getElementById('bLbl').onclick=e=>{showLbl=!showLbl; e.currentTarget.classList.toggle('on',showLbl);};

const ray=new THREE.Raycaster(); ray.firstHitOnly=true; const ptr=new THREE.Vector2(); let down=null;
function visiblePick(){ return cur.pick.filter(o=>cur.gmap[o.userData.gid].on); }
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return; const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(mv>6) return;
  if(tool){ toolClick(e); return; }
  const r=renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera); ray.firstHitOnly=false;
  const hits=ray.intersectObjects(visiblePick(),false); let id=null;
  for(const h of hits){ const o=h.object; if(o.material&&o.material.transparent&&o.material.opacity<.4&&!o.userData.item?.startsWith('h')) { if(o.userData.gid==='liver') continue; }
    id=o.userData.classify?o.userData.classify(h):o.userData.item; if(id) break; }
  select(id&&id!==sel?id:null);
});
function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();

const tmp=V(0,0,0), wp=V(0,0,0), dir=V(0,0,0); let frame=0;
const occRay=new THREE.Raycaster(); occRay.firstHitOnly=true;
function updateLabels(){
  const w=stage.clientWidth,h=stage.clientHeight; frame++;
  const doOcc=frame%8===0; const occObjs=doOcc?visiblePick().filter(o=>o.isMesh&&!(o.material.transparent&&o.material.opacity<.6)&&o.geometry.boundsTree):null;
  for(const L of cur.labels){
    const g=L.gid?cur.gmap[L.gid]:{on:true,obj:{position:{z:0}}};
    if(L.hideHH){ L.el.style.display='none'; continue; }
    if(!g.on||(!showLbl&&!L.keep&&!(sel&&L.item===sel))){L.el.style.display='none'; continue;}
    wp.copy(L.p); wp.z+=g.obj.position.z; tmp.copy(wp).project(camera);
    let vis=tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;
    if(vis&&doOcc){ dir.copy(wp).sub(camera.position); const dist=dir.length(); dir.normalize(); occRay.set(camera.position,dir); occRay.far=dist-.6; L.occ=occRay.intersectObjects(occObjs,false).length>0; }
    L.el.style.display=vis?'':'none';
    if(vis){ L.el.style.left=((tmp.x+1)/2*w)+'px'; L.el.style.top=((1-tmp.y)/2*h)+'px'; L.el.style.opacity=(L.occ&&!(sel&&L.item===sel))?'.28':'1'; }
  }
}
function loop(){controls.update(); renderer.render(cur.scene,camera); updateLabels(); requestAnimationFrame(loop);}
window.__V=views; window.__setCam=(p,t)=>{camera.position.set(...p); controls.target.set(...t); controls.update();};
show(location.hash.slice(1)||'pared'); loop();
</script>
